name: devsecops

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: demo-app

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gitleaks
          path: gitleaks.sarif

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Semgrep report
        run: semgrep scan --config p/default --config p/python --sarif --output semgrep.sarif . || true

      - name: Semgrep gate (fail on ERROR)
        run: semgrep scan --config p/default --config p/python --severity ERROR --error .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-semgrep
          path: semgrep.sarif

  sca:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/
          format: sarif
          output: trivy-sca.sarif
          exit-code: '0'

      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: app/
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy-sca
          path: trivy-sca.sarif

  iac:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov report
        run: |
          mkdir -p checkov_out
          checkov -d infra/ --framework terraform --output sarif --output-file-path checkov_out --soft-fail

      - name: Prepare report
        if: always()
        run: find checkov_out -name '*.sarif' -exec cp {} checkov.sarif \;

      - name: Checkov gate (fail on any failed check)
        run: checkov -d infra/ --framework terraform --compact --quiet

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-checkov
          path: checkov.sarif

  container:
    name: Container scan (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-trivy-image
          path: trivy-image.sarif

  report:
    name: Security report
    runs-on: ubuntu-latest
    needs: [secrets, sast, sca, iac, container]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports/
          merge-multiple: true

      - name: Build summary
        run: python3 scripts/summarize.py reports/ >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/

